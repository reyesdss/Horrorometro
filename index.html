<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Horrorómetro</title>
<style>
:root{--bg:#08090d;--panel:#111319;--line:#2b2e38;--text:#f5f2ed;--muted:#a7a9b2;--red:#c72340;--gold:#efc85e;--max:1240px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(199,35,64,.22),transparent 38%),#08090d;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(8,9,13,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:var(--max);margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:900 1.25rem Georgia,serif}.brand span{color:#ef4d67}
.links{display:flex;gap:8px;flex-wrap:wrap}.links button{border:1px solid var(--line);background:#111319;color:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}
.hero{min-height:66vh;display:grid;place-items:center;text-align:center;padding:86px 20px 58px}
.hero-inner{max-width:900px}.kicker{font-size:.72rem;letter-spacing:.23em;color:#dc6576;font-weight:900}
h1{font:900 clamp(4rem,10vw,8rem)/.88 Georgia,serif;margin:16px 0;letter-spacing:-.06em}
.hero p{max-width:720px;margin:auto;color:var(--muted);line-height:1.7}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{border:1px solid var(--line);background:#111319;color:#fff;border-radius:999px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:var(--red);border-color:var(--red)}
main{max-width:var(--max);margin:auto;padding:26px 18px 80px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}.stat{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.stat b{display:block;font-size:1.45rem}.stat span{color:var(--muted);font-size:.75rem}
.toolbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;position:sticky;top:63px;z-index:9;padding:12px 0;background:linear-gradient(#08090d 78%,transparent)}
.search{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff}
select{height:46px;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:12px;padding:0 10px}
.section{padding-top:38px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:15px}.head h2{font:700 clamp(1.9rem,4vw,3rem)/1 Georgia,serif;margin:0}.head p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:17px}.card{background:#111319;border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-4px);border-color:#555}
.poster{position:relative;aspect-ratio:2/3;background:#171820}.poster img{width:100%;height:100%;object-fit:cover;display:block}.fallback{height:100%;display:grid;place-items:center;text-align:center;padding:18px;background:radial-gradient(circle,#3b0e19,#121219 65%);color:#d6d1cc}
.rank{position:absolute;top:9px;left:9px;background:#050507dd;padding:6px 8px;border-radius:8px;font-weight:900}.body{padding:12px}.title{margin:0 0 6px;font-size:1rem;line-height:1.3}.meta{display:flex;justify-content:space-between;color:#999;font-size:.8rem}.score{color:var(--gold);font-weight:900}
.more{display:flex;justify-content:center;margin-top:20px}.more button{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer}
.creaturegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.creature{background:#0f1116;border:1px solid var(--line);border-radius:14px;padding:15px;min-height:185px}.source{color:#d65a6b;font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.creature h3{font-size:1rem;line-height:1.3;margin:7px 0}.creature p{color:#82848d;font-size:.75rem;margin:0}.creature .cs{margin-top:10px;color:var(--gold);font-weight:900}.google{display:inline-block;margin-top:10px;color:#eee;background:#161820;border:1px solid #353844;padding:7px 9px;border-radius:9px;text-decoration:none;font-size:.74rem}
.hidden{display:none!important}
dialog{width:min(900px,calc(100% - 20px));border:1px solid #454954;border-radius:18px;background:#0e1015;color:#fff;padding:0}dialog::backdrop{background:rgba(0,0,0,.82)}.modal{display:grid;grid-template-columns:250px 1fr;gap:22px;padding:22px}.modal-poster{aspect-ratio:2/3;border-radius:12px;overflow:hidden}.modal-poster img{width:100%;height:100%;object-fit:cover}.close{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:1px solid #555;background:#08090ddd;color:#fff;cursor:pointer}
footer{border-top:1px solid var(--line);padding:35px 18px 48px;text-align:center;color:#6d7078;font-size:.76rem}
@media(max-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}.creaturegrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.creaturegrid{grid-template-columns:repeat(2,1fr);gap:11px}.modal{grid-template-columns:110px 1fr;padding:15px;gap:14px}}
@media(max-width:420px){.toolbar{grid-template-columns:1fr}.search{grid-column:auto}.creaturegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="nav"><div class="brand">Horror<span>ómetro</span></div><div class="links"><button data-go="movies">Películas</button><button data-go="series">Series</button><button data-go="creatures">Criaturas</button><button data-go="vhs">V/H/S</button></div></div></header>
<section class="hero"><div class="hero-inner"><div class="kicker">RANKING PERSONAL · TERROR · MISTERIO · LO DESCONOCIDO</div><h1>Horrorómetro</h1><p>Mi colección personal del horror. Las calificaciones son exclusivamente mías.</p><div class="actions"><button class="btn primary" data-go="movies">Explorar ranking</button><button class="btn" id="random">🎲 Dame algo inquietante</button></div></div></section>
<main>
<div class="stats" id="stats"></div>
<div class="toolbar"><label class="search">🔎 <input id="q" type="search" placeholder="Buscar película, serie o criatura..." autocomplete="off"></label><select id="section"><option value="movies">Películas</option><option value="series">Series</option><option value="creatures">Criaturas</option><option value="vhs">V/H/S</option></select><select id="sort"><option value="rank">Mi ranking</option><option value="score">Mi calificación</option><option value="title">Título A-Z</option><option value="year">Año</option></select></div>

<section class="section" id="moviesSec"><div class="head"><div><h2>Top 10 películas</h2><p id="mc"></p></div></div><div class="grid" id="moviesGrid"></div><div class="more"><button data-more="movies">Ver más películas</button></div></section>
<section class="section" id="seriesSec"><div class="head"><div><h2>Top 10 series</h2><p id="sc"></p></div></div><div class="grid" id="seriesGrid"></div><div class="more"><button data-more="series">Ver más series</button></div></section>
<section class="section" id="creaturesSec"><div class="head"><div><h2>Top 10 criaturas</h2><p id="cc"></p></div></div><div class="creaturegrid" id="creatureGrid"></div><div class="more"><button data-more="creatures">Ver más criaturas</button></div></section>
<section class="section" id="vhsSec"><div class="head"><div><h2>Top 10 V/H/S</h2><p id="vc"></p></div></div><div class="creaturegrid" id="vhsGrid"></div><div class="more"><button data-more="vhs">Ver más V/H/S</button></div></section>
</main>

<dialog id="dlg"><button class="close" id="close">×</button><div id="modal"></div></dialog>
<footer>Horrorómetro · Mis calificaciones personales</footer>

<script>
// (El CATALOG fue omitido aquí visualmente para no saturar, pero mantén tu bloque const CATALOG={...} exactamente igual que como lo tienes)
const state={q:"",sort:"rank",open:{movies:false,series:false,creatures:false,vhs:false}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=x=>x.title??x.name??"Sin título", scoreOf=x=>x.rating??x.score??null;
const isCreatureSection=s=>s==="creatures"||s==="vhs";

function source(sec){
 if(sec==="vhs") return CATALOG.vhs?.length?CATALOG.vhs:(CATALOG.creatures||[]).filter(x=>String(x.work||"").toLowerCase().includes("v/h/s"));
 return CATALOG[sec]||[];
}
function order(list,sec){
 return list.slice().sort((a,b)=>{
   if(state.sort==="score") return Number(scoreOf(b)??-999)-Number(scoreOf(a)??-999);
   if(state.sort==="title") return titleOf(a).localeCompare(titleOf(b),"es");
   if(state.sort==="year") return Number(b.year||0)-Number(a.year||0);
   if(isCreatureSection(sec)) {
     const d=Number(scoreOf(b)??-999)-Number(scoreOf(a)??-999);
     return d || titleOf(a).localeCompare(titleOf(b),"es");
   }
   return Number(a.rank??a.position??99999)-Number(b.rank??b.position??99999);
 });
}
function filtered(list,sec){
 const q=state.q.trim().toLowerCase();
 return order(q?list.filter(x=>`${titleOf(x)} ${x.year||""} ${(x.genres||[]).join(" ")} ${x.work||""} ${x.segment||""}`.toLowerCase().includes(q)):list,sec);
}

function poster(item){
 const src = item.poster || item.poster_local; // ¡Línea corregida!
 if(src) return `<div class="poster"><img src="${esc(src)}" alt="${esc(titleOf(item))}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"><div class="fallback hidden">${esc(titleOf(item))}</div></div>`;
 return `<div class="poster"><div class="fallback">${esc(titleOf(item))}</div></div>`;
}
function movieCard(item,i){
 const a=document.createElement("article");a.className="card";a.innerHTML=`${poster(item)}<div class="rank">#${esc(item.rank??i+1)}</div><div class="body"><h3 class="title">${esc(titleOf(item))}</h3><div class="meta"><span>${esc(item.year??"—")}</span><span class="score">★ ${esc(scoreOf(item)??"—")}/10</span></div></div>`;
 a.onclick=()=>openDetail(item);return a;
}
function creatureCard(item){
 const name=titleOf(item),work=item.work||item.source||item.series||item.movie||"";
 const a=document.createElement("article");a.className="creature";a.innerHTML=`<div style="font-size:1.8rem">☠</div><div class="source">${esc(work||"BESTIARIO")}</div><h3>${esc(name)}</h3><p>${esc(item.segment||item.type||item.category||"Criatura / entidad")}</p><div class="cs">★ ${esc(scoreOf(item)??"—")} / 10</div><a class="google" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(name+" "+work)}">🔎 Buscar en Google</a>`;
 return a;
}
function render(sec){
 const list=filtered(source(sec),sec), show=state.open[sec]?list:list.slice(0,10);
 const grid=document.getElementById(sec==="movies"?"moviesGrid":sec==="series"?"seriesGrid":sec==="creatures"?"creatureGrid":"vhsGrid");
 const count=document.getElementById(sec==="movies"?"mc":sec==="series"?"sc":sec==="creatures"?"cc":"vc");
 grid.innerHTML="";show.forEach((x,i)=>grid.appendChild(sec==="movies"||sec==="series"?movieCard(x,i):creatureCard(x)));
 count.textContent=`Mostrando ${show.length} de ${list.length}`;
 const btn=document.querySelector(`[data-more="${sec}"]`);btn.classList.toggle("hidden",list.length<=10);btn.textContent=state.open[sec]?"Ver menos":"Ver más";
}
function renderAll(){["movies","series","creatures","vhs"].forEach(render)}
function scroll(sec){document.getElementById(sec+"Sec").scrollIntoView({behavior:"smooth"})}
function openDetail(item){
 document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-poster">${poster(item).replace('class="poster"','class="modal-poster"')}</div><div><div style="color:#d86475;font-weight:900;letter-spacing:.12em;font-size:.72rem">HORRORÓMETRO</div><h2 style="font:700 clamp(2rem,6vw,3.4rem)/.95 Georgia,serif;margin:8px 0 14px">${esc(titleOf(item))}</h2><div style="color:#efc85e;font-size:1.4rem;font-weight:900">★ ${esc(scoreOf(item)??"—")} / 10</div><p style="color:#a4a7ae;line-height:1.7"><b>Año:</b> ${esc(item.year??"—")}</p><p style="color:#a4a7ae;line-height:1.7">${esc(item.note||item.overview||"")}</p></div></div>`;
 document.getElementById("dlg").showModal();
}
document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{const s=b.dataset.more;state.open[s]=!state.open[s];render(s)});
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const s=b.dataset.go;document.getElementById("section").value=s;scroll(s)});
document.getElementById("q").oninput=e=>{state.q=e.target.value;Object.keys(state.open).forEach(k=>state.open[k]=false);renderAll()};
document.getElementById("sort").onchange=e=>{state.sort=e.target.value;renderAll()};
document.getElementById("section").onchange=e=>scroll(e.target.value);
document.getElementById("close").onclick=()=>document.getElementById("dlg").close();
document.getElementById("random").onclick=()=>{const a=[...(CATALOG.movies||[]),...(CATALOG.creatures||[])];if(a.length)openDetail(a[Math.floor(Math.random()*a.length)])};
document.getElementById("stats").innerHTML=[["Películas",CATALOG.movies?.length||0],["Series",CATALOG.series?.length||0],["Episodios",CATALOG.episodes?.length||0],["Criaturas",CATALOG.creatures?.length||0]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");

renderAll();

async function cargarPortadasGeneradas(){
 try{
   const respuestas = await Promise.all([
     fetch("data/movies.json?cb="+Date.now(), {cache:"no-store"}),
     fetch("data/series.json?cb="+Date.now(), {cache:"no-store"})
   ]);

   const archivos = [];
   for(const r of respuestas){
     if(r.ok){
       try{
         const d=await r.json();
         if(Array.isArray(d)) archivos.push(...d);
       }catch(e){}
     }
   }

   if(!archivos.length) return;

   const porId = new Map(archivos.filter(x=>x.id).map(x=>[String(x.id),x]));
   const porTitulo = new Map(archivos.map(x=>[titleOf(x).trim().toLowerCase(),x]));

   for(const lista of [CATALOG.movies||[], CATALOG.series||[]]){
     for(const item of lista){
       const encontrado = porId.get(String(item.id)) || porTitulo.get(titleOf(item).trim().toLowerCase());
       if(encontrado){
         if(encontrado.poster_local) item.poster_local = encontrado.poster_local;
         if(encontrado.poster) item.poster = encontrado.poster;
         if(encontrado.tmdb_id) item.tmdb_id = encontrado.tmdb_id;
       }
     }
   }

   renderAll();
 }catch(e){
 }
}

cargarPortadasGeneradas();

</script>
</body>
</html>
